name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels an older in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check, build and prerender
        run: npm run build
        env:
          VITE_WEB3FORMS_ACCESS_KEY: ${{ vars.VITE_WEB3FORMS_ACCESS_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}

      - name: Validate build output
        run: |
          set -e
          for f in index.html 404.html sitemap.xml robots.txt CNAME about/index.html contact/index.html services/artificial-intelligence/index.html; do
            test -s "dist/$f" || { echo "::error::Missing build output: dist/$f"; exit 1; }
          done
          grep -q '<link rel="canonical"' dist/about/index.html || { echo "::error::Prerendered SEO tags missing"; exit 1; }
          echo "Build output looks good: $(find dist -name index.html | wc -l) pages."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment
        if: always()
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "### ✅ Deployed to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Deployment failed — open this run's logs for details" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  notify-search-engines:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Notify Bing, Yandex and other IndexNow search engines
        continue-on-error: true
        run: |
          KEY=$(grep -oP "indexNowKey: '\\K[0-9a-f]+" src/config/site.ts)
          sleep 30  # give GitHub Pages a moment to serve the new files
          URLS=$(curl -fsS https://www.ukqaai.com/sitemap.xml | grep -oP '(?<=<loc>)[^<]+' | jq -R . | jq -sc .)
          BODY=$(jq -nc --arg key "$KEY" --argjson urls "$URLS" '{host:"www.ukqaai.com", key:$key, keyLocation:("https://www.ukqaai.com/" + $key + ".txt"), urlList:$urls}')
          CODE=$(curl -s -o /tmp/resp -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "IndexNow responded HTTP $CODE for $(echo "$URLS" | jq length) URLs"
          echo "### 🔎 IndexNow: HTTP $CODE ($(echo "$URLS" | jq length) URLs submitted)" >> "$GITHUB_STEP_SUMMARY"
